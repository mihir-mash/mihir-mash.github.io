<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ site.data.site.description }}">
    <meta name="theme-color" content="{{ site.data.site.accent_color }}">
    
    <title>{{ site.data.site.name }}</title>
    
    {% seo %}
    
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="icon" type="image/x-icon" href="{{ '/assets/favicon.ico' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="{{ '/' | relative_url }}" class="nav-brand">{{ site.data.site.name }}</a>
            <ul class="nav-menu">
                <li><a href="{{ '#about' | relative_url }}" class="nav-link">About</a></li>
                <li><a href="{{ '#education' | relative_url }}" class="nav-link">Education</a></li>
                <li><a href="{{ '#experience' | relative_url }}" class="nav-link">Experience</a></li>
                <li><a href="{{ '#projects' | relative_url }}" class="nav-link">Projects</a></li>
                <li><a href="{{ '#skills' | relative_url }}" class="nav-link">Skills</a></li>
                <li><a href="{{ '#achievements' | relative_url }}" class="nav-link">Achievements</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        {{ content }}
    </main>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-social">
                {% for social in site.data.site.social %}
                <a href="{{ social.url }}" class="social-link" title="{{ social.name }}" target="_blank" rel="noopener noreferrer">
                    {{ social.name }}
                </a>
                {% endfor %}
            </div>
            <p class="footer-text">&copy; 2025 {{ site.data.site.name }}. All rights reserved.</p>
        </div>
    </footer>

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
