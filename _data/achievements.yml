- title: National Champions - IN-SPACe CanSat India Student Competition Organised by ISRO
  date: '2025'
  description: Secured **1st place nationwide** at the IN-SPACe CanSat India Student Competition, organized
    by **IN-SPACe in association with ISRO and the Astronautical Society of India (ASI)**. We designed,
    developed, integrated, and tested the complete CanSat system, including its onboard electronics, autonomous
    flight systems, aerodynamic stabilization, payload, and real-time telemetry. During the final mission,
    the system performed successfully across all key phases, from deployment and descent to telemetry
