- title: Multimodal Post-Stroke Recovery Prediction
  status: Ongoing Research
  year: 2024 – Ongoing
  description: Developed an audio-visual deep learning framework for post-stroke recovery prediction using
    facial landmarks, speech features, and temporal attention.
  technologies:
  - Python
  - BiLSTM
  - Attention Mechanisms
  - TensorFlow
  - Deep Learning
  highlights:
  - Multimodal architecture integrating temporal facial landmark dynamics and MFCC speech representations
  - BiLSTM with attention-based temporal pooling for landmark motion modeling
  - Late fusion framework for joint multimodal representation
  - Reported R² = 0.964 on regression-based recovery prediction
  github: https://github.com/mihir-mash/Multimodal-Post-Stroke-Recovery-Prediction-using-Audio-Visual-Deep-Learning
