- title: 'DAMINI: Multilingual NLP & Reasoning'
  status: Manuscript under review for AAAI 2027
  year: '2026'
  description: Investigating reasoning-enhanced misogyny detection in Hindi through chain-of-thought supervision
    and parameter-efficient adaptation of multilingual and Indic language models.
  highlights:
  - Evaluate more than 10 models, including Llama-3, Qwen3, and Sarvam, on 2,240 Hindi YouTube comments.
  - Classify seven labels spanning misogyny categories and non-misogynistic content.
  - Use three-fold stratified cross-validation and macro-F1 to compare model performance.
  technologies:
  - Python
  - PyTorch
  - Hugging Face Transformers
  - LoRA
  - Unsloth
  - LLM Fine-tuning
- title: Efficient LLM Post-Training & GRPO
  status: Ongoing Research
  year: '2026'
  description: Studying reinforcement learning for reasoning improvement in smaller Indic language models,
    with resource-efficient post-training of Sarvam-2B.
  highlights:
  - Implement Group Relative Policy Optimization (GRPO) after supervised fine-tuning.
  - Combine 4-bit NF4 quantization with LoRA adaptation.
  - Design accuracy and format rewards; evaluate on Hindi MMLU against a pretrained baseline.
  technologies:
  - PyTorch
  - Hugging Face Transformers
  - TRL
  - PEFT
  - BitsAndBytes
  - LoRA
  - GRPO
  - Reward Engineering
- title: 'SSRGNet: Protein Secondary Structure Prediction'
  status: Ongoing Research
  year: '2026'
  description: Investigating sequence–structure fusion for protein secondary structure prediction using
    DistilProtBERT, 3D structural graphs, and relation-aware graph message passing.
  highlights:
  - Fuse protein language model representations with GCN and R-GCN structural features.
  - Model sequential, spatial proximity, and local environment relations.
  - Evaluate three-state and eight-state prediction on NetSurfP-2.0, CB513, CASP12, and TS115.
  technologies:
  - PyTorch
  - GCN
  - R-GCN
  - DistilProtBERT
  - Hugging Face
  - Graph Neural Networks
- title: Multimodal Post-Stroke Recovery Prediction
  status: Manuscript submitted to IEEE DELCON
  year: 2024 – Ongoing
  description: Developed a multimodal deep learning framework that combines temporal facial landmark dynamics
    and speech features to predict post-stroke neurological recovery. A manuscript has been submitted
    to IEEE DELCON.
  highlights:
  - Combine MFCC speech features and facial landmark sequences with late fusion.
  - Use BiLSTM encoders and attention-based temporal pooling.
  - Reported R² = 0.964 for regression-based recovery prediction.
  technologies:
  - Python
  - BiLSTM
  - Attention Mechanisms
  - TensorFlow
  - Deep Learning
  github: https://github.com/mihir-mash/Multimodal-Post-Stroke-Recovery-Prediction-using-Audio-Visual-Deep-Learning
