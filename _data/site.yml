about_research: My work spans graph neural networks for protein structure prediction, multimodal learning
  for post-stroke recovery, and computer vision for aerial imagery. Alongside AI research, I have designed
  and integrated CanSat mechanical structures, onboard electronics, sensor telemetry, and ground stations.
  Our teams placed 10th worldwide in 2026 and won the 2025 IN-SPACe national competition; our portable
  Pokémon-themed ground station received the Mark Walker Ground Station Award.
interests: 'Research interests: efficient and reliable AI, multimodal perception, and intelligent aerospace
  systems.'
